<nav class="navbar">
  <div class="logo">
    <a routerLink="/contacts">Address Book</a>
  </div>

  <div class="nav-links">
    @if (authService.isLoggedIn()) {
      <div class="user-info">
        <span class="welcome-msg">Welcome, <strong>{{ userName }}</strong></span>
        <button type="button" class="logout-btn" (click)="onLogout()">Logout</button>
      </div>
    } @else {
      <div class="auth-links">
        <a routerLink="/login">Login</a>
      </div>
    }
  </div>
</nav>
